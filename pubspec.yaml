name: bingo_pay
description: "Bingo Pay — Multi-vendor marketplace app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

  # Navigation
  go_router: ^14.6.3

  # Dependency injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Network
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.4.0

  # Storage
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.3
  encrypt: ^5.0.3

  # Functional error handling
  fpdart: ^1.1.0

  # Flavor configuration
  flutter_flavor: 3.1.4

  # Device
  image_picker: ^1.2.2
  permission_handler: ^11.4.0
  connectivity_plus: ^6.1.4
  printing: ^5.14.2
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  mobile_scanner: ^7.2.0
  # Pure-Dart QR decoding fallback for gallery images — mobile_scanner's
  # native analyzeImage (Vision API) is hard-unsupported on the iOS Simulator.
  zxing2: ^0.2.4
  image: ^4.9.1
  share_plus: ^12.0.2



  # Utilities
  logger: ^2.5.0
  intl: ^0.19.0
  sizer: ^3.1.3
  json_annotation: ^4.9.0
  pinput: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  injectable_generator: ^2.7.0
  json_serializable: ^6.9.5
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/data/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
