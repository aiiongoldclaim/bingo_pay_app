name: bingo_pay
description: "Bingo Pay — Multi-vendor marketplace app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0

  # Navigation
  go_router: ^17.3.0

  # Dependency injection
  get_it: ^9.2.1
  injectable: ^3.0.0

  # Network
  dio: ^5.10.0
  pretty_dio_logger: ^1.4.0

  # Storage
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5

  # Functional error handling
  fpdart: ^1.2.0

  # Flavor configuration
  flutter_flavor: 3.1.4

  # Device
  image_picker: ^1.2.3
  file_picker: ^12.0.0-beta.7
  permission_handler: ^12.0.3
  connectivity_plus: ^7.2.0
  share_plus: ^13.2.0
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.4

  # Utilities
  logger: ^2.5.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  encrypt: ^5.0.3
  qr_flutter: ^4.1.0
  uuid: ^4.5.3

  # Charts
  fl_chart: ^1.2.0

  # Image caching
  cached_network_image: ^3.4.1

  # Toasts
  toastification: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  injectable_generator: ^3.0.2
  json_serializable: ^6.9.5
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/data/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/launcher/app_icon.png
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: assets/icons/logo_icon.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo.png
  color_dark: "#121212"
  image_dark: assets/icons/logo_icon.png
  android_12:
    color: "#FFFFFF"
    image: assets/icons/logo_icon.png
    color_dark: "#121212"
    image_dark: assets/icons/logo_icon.png
